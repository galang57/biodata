<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galang Saputra | Portfolio Profesional</title>
    <meta name="description" content="Website resmi Galang Saputra, siswa Jurusan RPL SMK Negeri 3 Lubuklinggau.">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --bg: #050b18;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #050b18);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Efek Latar Belakang Cahaya */
        .blob {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--secondary);
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1;
            animation: move 10s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-50%, -50%); }
            to { transform: translate(50%, 50%); }
        }

        /* Card Glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
        }

        .profile-img {
            width: 100px;
            height: 100px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: 800;
        }

        .badge {
            background: rgba(0, 210, 255, 0.1);
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 15px;
            display: inline-block;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        p {
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 600;
            display: inline-block;
            transition: opacity 0.3s;
        }

        .btn:hover { opacity: 0.9; }

        .footer {
            margin-top: 30px;
            font-size: 11px;
            color: #475569;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="blob"></div>

    <div class="glass-card">
        <div class="badge">Professional Portfolio</div>
        <div class="profile-img">GS</div>
        <h1>Galang Saputra</h1>
        <p>Student at SMK Negeri 3 Lubuklinggau <br> Informatics & Software Engineering</p>
        
        <a href="#" class="btn">Hubungi Saya</a>
        
        <div class="footer">
            DESIGNED IN TERMUX &bull; 2026
        </div>
    </div>

</body>
</html>
